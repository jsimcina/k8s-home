---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audiobookrequest
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: audiobookrequest-secret
    template:
      data:
        # Only used to create the root admin when the database has no users
        ABR_APP__INIT_ROOT_USERNAME: "{{ .ABR_ADMIN_USERNAME }}"
        ABR_APP__INIT_ROOT_PASSWORD: "{{ .ABR_ADMIN_PASSWORD }}"
        # Database
        ABR_DB__USE_POSTGRES: "true"
        ABR_DB__POSTGRES_HOST: "{{ .POSTGRES_HOST }}"
        ABR_DB__POSTGRES_PORT: "5432"
        ABR_DB__POSTGRES_DB: audiobookrequest
        ABR_DB__POSTGRES_USER: abr_db
        ABR_DB__POSTGRES_PASSWORD: "{{ .ABR_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: audiobookrequest
    - extract:
        key: cloudnativepg
