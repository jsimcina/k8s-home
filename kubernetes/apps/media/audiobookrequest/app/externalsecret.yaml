---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audiobookrequest
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: audiobookrequest-secret
    template:
      data:
        # Only used to create the root admin when the database has no users
        ABR_APP__INIT_ROOT_USERNAME: "{{ .ABR_ADMIN_USERNAME }}"
        ABR_APP__INIT_ROOT_PASSWORD: "{{ .ABR_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: audiobookrequest
