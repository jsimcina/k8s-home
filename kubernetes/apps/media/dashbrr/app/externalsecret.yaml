---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashbrr-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dashbrr-secret
    template:
      data:
        # App
        DASHBRR_RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        DASHBRR_SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        DASHBRR_PROWLARR_API_KEY: "{{ .PROWLARR_API_KEY }}"
        DASHBRR_OVERSEERR_API_KEY: "{{ .JELLYSEERR_API_KEY }}"
        #DASHBRR_PLEX_API_KEY: "{{ .PLEX_API_KEY }}"
        DASHBRR__DB_TYPE: postgres
        DASHBRR__DB_NAME: "{{ .DASHBRR_POSTGRES_DATABASE }}"
        DASHBRR__DB_HOST: "{{ .POSTGRES_HOST }}"
        DASHBRR__DB_PORT: "{{ .POSTGRES_PORT }}"
        DASHBRR__DB_USER: "{{ .DASHBRR_POSTGRES_USER }}"
        DASHBRR__DB_PASSWORD: "{{ .DASHBRR_POSTGRES_PASSWORD }}"
        OIDC_ISSUER: "{{ .OIDC_ISSUER }}"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        OIDC_REDIRECT_URL: "{{ .OIDC_REDIRECT_URL }}"
        # --
  dataFrom:
    - extract:
        key: cloudnativepg
    - extract:
        key: dashbrr
    - extract:
        key: radarr
    - extract:
        key: sonarr
    - extract:
        key: prowlarr
    - extract:
        key: jellyseerr
