---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sonarr-secret
    template:
      data:
        SONARR__AUTH__APIKEY: "{{ .SONARR_API_KEY }}"
        PUSHOVER_TOKEN: "{{ .SONARR_PUSHOVER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        #Database
        SONARR__POSTGRES__HOST: "{{ .POSTGRES_HOST }}"
        SONARR__POSTGRES__PORT: "{{ .POSTGRES_PORT }}"
        SONARR__POSTGRES__USER: "{{ .SONARR_POSTGRES_USER }}"
        SONARR__POSTGRES__PASSWORD: "{{ .SONARR_POSTGRES_PASSWORD }}"
        SONARR__POSTGRES__MAINDB: "{{ .SONARR_POSTGRES_MAINDB }}"
  dataFrom:
    - extract:
        key: pushover-secret
    - extract:
        key: sonarr
    - extract:
        key: cloudnativepg
