---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pinepods
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pinepods-secret
    template:
      data:
        # Admin User
        USERNAME: "{{ .PINEPODS_ADMIN_USER }}"
        PASSWORD: "{{ .PINEPODS_ADMIN_PASS }}"
        FULLNAME: "{{ .PINEPODS_ADMIN_NAME }}"
        EMAIL: "{{ .PINEPODS_ADMIN_EMAIL }}"
        # Database
        DB_TYPE: postgresql
        DB_NAME: pinepods
        DB_HOST: "{{ .POSTGRES_HOST }}"
        DB_PORT: "{{ .POSTGRES_PORT }}"
        DB_USER: "{{ .PINEPODS_POSTGRES_USER }}"
        DB_PASSWORD: "{{ .PINEPODS_POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: pinepods
    - extract:
        key: cloudnativepg