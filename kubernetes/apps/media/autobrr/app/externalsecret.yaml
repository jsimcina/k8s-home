---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autobrr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: autobrr-secret
    template:
      data:
        AUTOBRR__DATABASE_TYPE: postgres
        AUTOBRR__POSTGRES_DATABASE: "{{ .AUTOBRR_POSTGRES_DATABASE }}"
        AUTOBRR__POSTGRES_HOST: "{{ .POSTGRES_HOST }}"
        AUTOBRR__POSTGRES_USER: "{{ .AUTOBRR_POSTGRES_USER }}"
        AUTOBRR__POSTGRES_PASS: "{{ .AUTOBRR_POSTGRES_PASS }}"
        AUTOBRR__POSTGRES_PORT: "{{ .POSTGRES_PORT }}"
        AUTOBRR__SESSION_SECRET: "{{ .AUTOBRR_SESSION_SECRET }}"
        # API key for Claude to manage filters via the local API; not read by autobrr
        CLAUDE_API_KEY: "{{ .Claude_APIKey }}"
  dataFrom:
    - extract:
        key: autobrr
    - extract:
        key: cloudnativepg
