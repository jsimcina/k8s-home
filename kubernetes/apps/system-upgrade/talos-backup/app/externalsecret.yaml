---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: talos-backup-secret
  # Explicit fields rather than dataFrom.extract: the item also holds the age
  # private key as an attachment and a note, and none of that belongs in the cluster.
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: talos-backup
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: talos-backup
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AGE_RECIPIENT_PUBLIC_KEY
      remoteRef:
        key: talos-backup
        property: AGE_RECIPIENT_PUBLIC_KEY
