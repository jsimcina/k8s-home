---
# Talos API access for the backup job: the Talos controller turns this into a
# Secret named talos-backup holding a talosconfig limited to this role.
# The role must be listed in allowedRoles (talos/controlplane.yaml.j2) and this
# namespace in allowedKubernetesNamespaces.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup
spec:
  roles:
    - os:etcd:backup
