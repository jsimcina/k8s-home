---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: talos-backup
spec:
  chartRef:
    kind: OCIRepository
    name: talos-backup
  interval: 1h
  values:
    controllers:
      talos-backup:
        type: cronjob
        cronjob:
          schedule: 0 */6 * * *
          backoffLimit: 2
          concurrencyPolicy: Forbid
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: ghcr.io/siderolabs/talos-backup
              tag: v0.1.0-beta.3-10-gb9fd478@sha256:7fc186ff37a3137f470082cb609bf1dc3bcece13dd9a6421ec09cfdf4f33ae6c
            command:
              - /talos-backup
            workingDir: /tmp
            env:
              AWS_REGION: us-east-1
              BUCKET: kopiur
              CLUSTER_NAME: main
              CUSTOM_S3_ENDPOINT: https://nas.jonandlinz.com:9010
              ENABLE_COMPRESSION: "true"
              S3_PREFIX: etcd-backup
              USE_PATH_STYLE: "true"
            envFrom:
              - secretRef:
                  name: talos-backup-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 1Gi
      # Off-site copy: once a day to Cloudflare R2, which keeps 30 days
      # (bucket lifecycle rule on etcd-backup/), same as the prune job below
      r2:
        type: cronjob
        cronjob:
          schedule: 30 4 * * *
          timeZone: America/Chicago
          backoffLimit: 2
          concurrencyPolicy: Forbid
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: ghcr.io/siderolabs/talos-backup
              tag: v0.1.0-beta.3-10-gb9fd478@sha256:7fc186ff37a3137f470082cb609bf1dc3bcece13dd9a6421ec09cfdf4f33ae6c
            command:
              - /talos-backup
            workingDir: /tmp
            env:
              AWS_REGION: auto
              BUCKET: kopiurbackups
              CLUSTER_NAME: main
              CUSTOM_S3_ENDPOINT: https://531a6d1ed13dfc473dcac1270662c109.r2.cloudflarestorage.com
              ENABLE_COMPRESSION: "true"
              S3_PREFIX: etcd-backup
              USE_PATH_STYLE: "true"
            envFrom:
              - secretRef:
                  name: talos-backup-r2-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 1Gi
      # TrueNAS S3 has no lifecycle rules ("lifecycle is not implemented"),
      # so this deletes etcd snapshots older than 30 days from the NAS bucket
      prune:
        type: cronjob
        cronjob:
          schedule: 15 5 * * *
          timeZone: America/Chicago
          backoffLimit: 2
          concurrencyPolicy: Forbid
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: docker.io/rclone/rclone
              tag: 1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
            args:
              - delete
              - :s3:kopiur/etcd-backup
              - --min-age=30d
              - --verbose
            env:
              HOME: /tmp
              RCLONE_CONFIG: /tmp/rclone.conf
              RCLONE_S3_ENDPOINT: https://nas.jonandlinz.com:9010
              RCLONE_S3_ENV_AUTH: "true"
              RCLONE_S3_PROVIDER: Other
              RCLONE_S3_REGION: us-east-1
            envFrom:
              - secretRef:
                  name: talos-backup-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 2Gi
      talos-home:
        type: emptyDir
        advancedMounts:
          talos-backup: &talosHome
            app:
              - path: /.talos
          r2: *talosHome
      talos:
        type: secret
        name: talos-backup
        advancedMounts:
          talos-backup: &talosSecret
            app:
              - path: /var/run/secrets/talos.dev
                readOnly: true
          r2: *talosSecret
