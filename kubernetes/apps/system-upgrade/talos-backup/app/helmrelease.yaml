---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: talos-backup
spec:
  chartRef:
    kind: OCIRepository
    name: talos-backup
  interval: 1h
  values:
    controllers:
      talos-backup:
        type: cronjob
        cronjob:
          schedule: 0 */6 * * *
          backoffLimit: 2
          concurrencyPolicy: Forbid
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: ghcr.io/siderolabs/talos-backup
              tag: v0.1.0-beta.3-10-gb9fd478@sha256:7fc186ff37a3137f470082cb609bf1dc3bcece13dd9a6421ec09cfdf4f33ae6c
            command:
              - /talos-backup
            workingDir: /tmp
            env:
              AWS_REGION: us-east-1
              BUCKET: kopiur
              CLUSTER_NAME: main
              CUSTOM_S3_ENDPOINT: http://nas.jonandlinz.com:9000
              ENABLE_COMPRESSION: "true"
              S3_PREFIX: etcd-backup
              USE_PATH_STYLE: "true"
            envFrom:
              - secretRef:
                  name: talos-backup-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 2Gi
      talos-home:
        type: emptyDir
        globalMounts:
          - path: /.talos
      talos:
        type: secret
        name: talos-backup
        globalMounts:
          - path: /var/run/secrets/talos.dev
            readOnly: true
