---
# Talos API access for the defrag job: the Talos controller turns this into a
# Secret named etcd-defrag holding a talosconfig limited to this role.
# EtcdDefragment needs os:operator (os:etcd:backup can't call it); the role is
# already in allowedRoles (talos/controlplane.yaml.j2) and this namespace in
# allowedKubernetesNamespaces.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-defrag
spec:
  roles:
    - os:operator
