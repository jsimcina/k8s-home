---
# Dedicated cluster for kritika, separate from the shared `postgres` cluster in
# `database`: its own image pin, roles, pg_hba and failure domain.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kritika-postgres
spec:
  instances: 2
  # Its own ImageCatalog rather than the shared ClusterImageCatalog, so a
  # Postgres or vchord bump rolls this cluster independently of production
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: kritika-postgres
    major: 18
  postgresql:
    extensions:
      - name: vchord
    shared_preload_libraries:
      - vchord
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  primaryUpdateMethod: switchover
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    additionalPodAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: nodatabase
                operator: Exists
          topologyKey: kubernetes.io/hostname
  storage:
    size: 10Gi
    storageClass: miroir-local
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  bootstrap:
    initdb:
      database: kritika
      secret:
        name: kritika-postgres-credentials
