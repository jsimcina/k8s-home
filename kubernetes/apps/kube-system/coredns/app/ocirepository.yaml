---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: coredns
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Held on 1.46.2 (CoreDNS 1.13.1) - 1.47.0+ (CoreDNS 1.14.3+) has a
    # confirmed, still-open upstream regression where autopath + cache
    # (prefetch/serve_stale) intermittently returns empty-A for external
    # names on parallel A/AAAA lookups. Our Corefile hits every trigger
    # condition. See coredns/coredns#8390 and the renovate hold in
    # .renovaterc.json5.
    tag: 1.46.2
  url: oci://ghcr.io/coredns/charts/coredns
