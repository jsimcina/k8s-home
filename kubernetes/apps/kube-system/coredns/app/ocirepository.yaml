---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: coredns
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Chart held on 1.46.2 while the CoreDNS 1.14.7 image (pinned in
    # helmrelease.yaml) soaks. 1.14.3-1.14.6 had the autopath + cache
    # (prefetch/serve_stale) empty-A regression, coredns/coredns#8390, fixed
    # in 1.14.7. Once 1.14.7 is proven here, drop the image pin and the
    # renovate hold in .renovaterc.json5 and move to chart 1.48.1+.
    tag: 1.46.2
  url: oci://ghcr.io/coredns/charts/coredns
