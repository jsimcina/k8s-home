---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: onepassword-connect
  labels:
    # Bootstrap-critical: ghcr-credentials can't exist before this app runs,
    # so it must stay pullable unauthenticated. See ../../ghcr-credentials.
    home-operations.com/ghcr-auth-exempt: "true"
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 2.4.1
  url: oci://ghcr.io/1password/connect
