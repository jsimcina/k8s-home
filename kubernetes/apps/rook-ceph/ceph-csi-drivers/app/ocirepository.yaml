---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ceph-csi-drivers
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Must track the ceph-csi-operator subchart version pinned inside
    # whatever rook-ceph version is deployed - 1.0.4 for rook-ceph v1.20.7.
    tag: "1.0.5"
  url: oci://ocharted.jonandlinz.io/ceph.github.io/ceph-csi-operator/ceph-csi-drivers
