---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod }} has had backends waiting on a lock for over 5 minutes
            summary: Backends have been waiting for over 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 0
          for: 5m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 300,000,000 transactions from frozen xid in database {{ $labels.datname }} on pod {{ $labels.pod }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 300000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There were over 10 deadlocks in the last hour in database {{ $labels.datname }} on {{ $labels.pod }}
            summary: Checks the number of deadlocks
          expr: |-
            increase(cnpg_pg_stat_database_deadlocks[1h]) > 10
          for: 1m
          labels:
            severity: warning
        - alert: BackupStale
          annotations:
            description: The last successful base backup in namespace {{ $labels.namespace }} finished over 36 hours ago
            summary: No successful base backup in 36 hours
          expr: |-
            time() - max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 129600
          for: 15m
          labels:
            severity: warning
        - alert: BackupFailed
          annotations:
            description: The most recent base backup in namespace {{ $labels.namespace }} failed and no later backup has succeeded
            summary: The latest base backup failed
          expr: |-
            max by (namespace) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp)
              > max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
          for: 15m
          labels:
            severity: warning
        - alert: BackupMetricsAbsent
          annotations:
            description: The barman-cloud plugin is not reporting backup metrics, so backup alerts cannot fire
            summary: Backup metrics missing
          expr: |-
            absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
          for: 30m
          labels:
            severity: warning
