---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    additionalPodAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: nodatabase
                operator: Exists
          topologyKey: "kubernetes.io/hostname"
  enableSuperuserAccess: true
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: postgres-loadbalancer
              annotations:
                external-dns.kubernetes.io/hostname: cnpgsql.jonandlinz.io
                gatus.home-operations.com/endpoint: |-
                  group: services
                  ui:
                    hide-hostname: true
                    hide-url: true
                lbipam.cilium.io/ips: 10.12.0.225
            spec:
              type: LoadBalancer
  instances: 3
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    major: 18
    name: postgresql-standard-trixie
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters: &barmanParameters
        barmanObjectName: cfr2
        serverName: postgres18
  postgresql:
    parameters:
      checkpoint_timeout: 30min
      max_connections: "600"
      shared_buffers: 512MB
      wal_compression: lz4
      # Setting any pg_stat_statements.* parameter makes CNPG preload the
      # library and create the extension.
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
    shared_preload_libraries:
      - "vchord.so"
  primaryUpdateMethod: switchover
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 3Gi
  storage:
    size: 25Gi
    storageClass: miroir-local
  superuserSecret:
    name: cloudnative-pg-secret
  # Record of the Miroir migration (restore of the 2026-09-08 backup). It only
  # applies when this Cluster is created. For disaster recovery follow
  # docs/postgres-disaster-recovery.md instead of recreating from this block.
  bootstrap:
    recovery:
      source: postgres18-v1
      recoveryTarget:
        backupID: "20260908T000000"
  externalClusters:
    - name: postgres18-v1
      plugin:
        isWALArchiver: true
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cfr2
          serverName: postgres18-v1
