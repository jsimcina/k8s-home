---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bazarr-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: bazarr_db
        password: "{{ .BAZARR_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: bazarr
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: bazarr
spec:
  cluster:
    name: postgres
  name: bazarr_db
  login: true
  passwordSecret:
    name: bazarr-postgres-credentials
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: bazarr
spec:
  cluster:
    name: postgres
  name: bazarr
  owner: bazarr_db
