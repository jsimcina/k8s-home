---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: grafana_db
        password: "{{ .GRAFANA_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: grafana-secret
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: grafana
spec:
  cluster:
    name: postgres
  name: grafana_db
  login: true
  passwordSecret:
    name: grafana-postgres-credentials
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: grafana
spec:
  cluster:
    name: postgres
  name: grafana
  owner: grafana_db
