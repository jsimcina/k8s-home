---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audiobookrequest-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: audiobookrequest-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: abr_db
        password: "{{ .ABR_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: audiobookrequest
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: audiobookrequest
spec:
  cluster:
    name: postgres
  name: abr_db
  login: true
  passwordSecret:
    name: audiobookrequest-postgres-credentials
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: audiobookrequest
spec:
  cluster:
    name: postgres
  name: audiobookrequest
  owner: abr_db
