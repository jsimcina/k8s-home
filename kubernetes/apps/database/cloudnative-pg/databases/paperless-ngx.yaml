---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperless-ngx-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: paperless_db
        password: "{{ .PAPERLESS_DBPASS }}"
  dataFrom:
    - extract:
        key: paperlessngx
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: paperless-ngx
spec:
  cluster:
    name: postgres
  name: paperless_db
  login: true
  passwordSecret:
    name: paperless-ngx-postgres-credentials
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: paperless-ngx
spec:
  cluster:
    name: postgres
  name: paperless-ngx
  owner: paperless_db
