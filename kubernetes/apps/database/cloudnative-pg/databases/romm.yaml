---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: romm-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: romm_db
        password: "{{ .ROMM_DB_PASSWORD }}"
  dataFrom:
    - extract:
        key: romm
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: romm
spec:
  cluster:
    name: postgres
  name: romm_db
  login: true
  passwordSecret:
    name: romm-postgres-credentials
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: romm
spec:
  cluster:
    name: postgres
  name: romm
  owner: romm_db
