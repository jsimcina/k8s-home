---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sonarr-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: sonarr_db
        password: "{{ .SONARR_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: sonarr
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: sonarr
spec:
  cluster:
    name: postgres
  name: sonarr_db
  login: true
  passwordSecret:
    name: sonarr-postgres-credentials
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: sonarr
spec:
  cluster:
    name: postgres
  name: sonarr_main
  owner: sonarr_db
