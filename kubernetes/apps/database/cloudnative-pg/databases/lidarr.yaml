---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lidarr-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: lidarr_db
        password: "{{ .LIDARR_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: lidarr
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: lidarr
spec:
  cluster:
    name: postgres
  name: lidarr_db
  login: true
  passwordSecret:
    name: lidarr-postgres-credentials
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: lidarr
spec:
  cluster:
    name: postgres
  name: lidarr_main
  owner: lidarr_db
