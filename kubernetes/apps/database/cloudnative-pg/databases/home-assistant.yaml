---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: home-assistant-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: homeass_db
        password: "{{ .HA_DATABASE_PASSWORD }}"
  dataFrom:
    - extract:
        key: home-assistant-secret
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: home-assistant
spec:
  cluster:
    name: postgres
  name: homeass_db
  login: true
  passwordSecret:
    name: home-assistant-postgres-credentials
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: home-assistant
spec:
  cluster:
    name: postgres
  name: homeass
  owner: homeass_db
