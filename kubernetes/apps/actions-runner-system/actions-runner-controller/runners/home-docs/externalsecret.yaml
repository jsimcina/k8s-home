---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-docs-runner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: home-docs-runner-secret
    template:
      data:
        github_app_id: "{{ .ACTION_RUNNER_CONTROLLER_GITHUB_APP_ID }}"
        github_app_installation_id: "{{ .ACTION_RUNNER_CONTROLLER_GITHUB_INSTALLATION_ID }}"
        github_app_private_key: "{{ .ACTION_RUNNER_CONTROLLER_GITHUB_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: actions-runner-controller
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-docs-runner-truenas
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: home-docs-runner-truenas
  dataFrom:
    - extract:
        key: truenas-gha-deploy
