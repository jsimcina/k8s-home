---
# The chart creates the paseo ServiceAccount. Same reach as claude-remote; agent tool calls are still
# approved in the Paseo app unless a session is started with permissions bypassed
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paseo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: paseo
    namespace: default
