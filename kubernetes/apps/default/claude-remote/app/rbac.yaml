---
# The chart creates the claude-remote ServiceAccount. Same reach as the WSL kubeconfig; every action is still approved from the Claude app
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-remote
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: claude-remote
    namespace: default
