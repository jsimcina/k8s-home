---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-remote
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: claude-remote-secret
    template:
      data:
        # Fine-grained PAT scoped to jsimcina/k8s-home (contents, pull requests)
        GH_TOKEN: "{{ .CLAUDE_REMOTE_GH_TOKEN }}"
        # Stored base64-encoded: 1Password fields are single-line
        talosconfig: "{{ .CLAUDE_REMOTE_TALOSCONFIG_B64 | b64dec }}"
        UNIFI_MCP_TOKEN: "{{ .UNIFI_MCP_TOKEN }}"
        UNIFI2_MCP_TOKEN: "{{ .UNIFI2_MCP_TOKEN }}"
        # Controller login for the unifi-network plugin's own server; the dashed keys are
        # only read as files from /secrets
        UNIFI_CONTROLLER_HOST: "{{ .UNIFI_HOST }}"
        UNIFI_CONTROLLER_USERNAME: "{{ .UNIFI_USERNAME }}"
        unifi-password: "{{ .UNIFI_PASSWORD }}"
        unifi-api-key: "{{ .UNIFI_API_KEY }}"
        MEMINI_API_KEY: "{{ .MEMINI_JON_API_KEY }}"
  # unifi-mcp-2's item reuses unifi-mcp's field names, so only its token is pulled, renamed
  data:
    - secretKey: UNIFI2_MCP_TOKEN
      remoteRef:
        key: unifi-mcp-2
        property: UNIFI_MCP_TOKEN
  dataFrom:
    - extract:
        key: claude-remote
    - extract:
        key: unifi-mcp
    - extract:
        key: memini
