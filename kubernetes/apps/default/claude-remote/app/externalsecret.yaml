---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-remote
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: claude-remote-secret
    template:
      data:
        # Fine-grained PAT scoped to jsimcina/k8s-home (contents, pull requests)
        GH_TOKEN: "{{ .CLAUDE_REMOTE_GH_TOKEN }}"
        talosconfig: "{{ .CLAUDE_REMOTE_TALOSCONFIG }}"
        UNIFI_MCP_TOKEN: "{{ .UNIFI_MCP_TOKEN }}"
        MEMINI_API_KEY: "{{ .MEMINI_JON_API_KEY }}"
  dataFrom:
    - extract:
        key: claude-remote
    - extract:
        key: unifi-mcp
    - extract:
        key: memini
