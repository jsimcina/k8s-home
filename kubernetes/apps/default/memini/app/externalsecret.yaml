---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memini-secret
    template:
      data:
        # Break-glass admin key; also the only key that can bootstrap named keys
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        # Shares Kritika's OpenRouter key for embeddings
        MEMINI_EMBED_API_KEY: "{{ .KRITIKA_OPENROUTER_API_KEY }}"
  dataFrom:
    - extract:
        key: memini
    - extract:
        key: kritika
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini-api-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memini-api-keys
    template:
      data:
        api-keys.yaml: |-
          keys:
            - name: jon
              secret: "{{ .MEMINI_JON_API_KEY }}"
              home: personal/jon
  dataFrom:
    - extract:
        key: memini
