---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dockerify-android-scrcpy
spec:
  chartRef:
    kind: OCIRepository
    name: dockerify-android-scrcpy
  interval: 1h
  values:
    controllers:
      dockerify-android-scrcpy:
        containers:
          app:
            image:
              repository: docker.io/shmayro/scrcpy-web
              tag: latest
            command:
              - sh
              - -c
              - |
                adb connect dockerify-android.default.svc.cluster.local:5555 &&
                npm start
            env:
              TZ: America/Chicago
            # Image has no USER directive and its app lives under /root -
            # it's built to run as root, so runAsNonRoot is dropped for this
            # controller. Root can still read under a read-only rootfs, adb
            # just needs somewhere writable for its startup log and adbkey.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      android-home:
        type: emptyDir
        globalMounts:
          - path: /root/.android
    service:
      app:
        ports:
          http:
            port: &port 8000
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.jonandlinz.io"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
