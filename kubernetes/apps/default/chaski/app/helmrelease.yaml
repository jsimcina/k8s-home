---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaski
spec:
  chartRef:
    kind: OCIRepository
    name: chaski
  interval: 1h
  values:
    replicaCount: 2
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    env:
      TZ: America/Chicago
    envFrom:
      - secretRef:
          name: chaski-secret
    config:
      targets:
        radarr:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "RADARR_PUSHOVER_TOKEN" }}
        sonarr:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "SONARR_PUSHOVER_TOKEN" }}
        seerr:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "SEERR_PUSHOVER_TOKEN" }}
      routes:
        radarr-download:
          target: radarr
          title: Movie {{ if .payload.isUpgrade }}Upgraded{{ else }}Added{{ end }}
          message: |-
            <b>{{ .payload.movie.title }} ({{ .payload.movie.year }})</b>
            <small>{{ .payload.movie.overview | ellipsis 300 }}</small>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: low
            url: "{{ .payload.applicationUrl }}/movie/{{ .payload.movie.tmdbId }}"
            url_title: View Movie
          whenExpr: payload.eventType == "Download"
        radarr-manual:
          target: radarr
          title: Movie Requires Manual Interaction
          message: |-
            <b>{{ .payload.movie.title }} ({{ .payload.movie.year }})</b>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: high
            url: "{{ .payload.applicationUrl }}/activity/queue"
            url_title: View Queue
          whenExpr: payload.eventType == "ManualInteractionRequired"
        sonarr-download:
          target: sonarr
          title: Episode {{ if .payload.isUpgrade }}Upgraded{{ else }}Added{{ end }}
          message: |-
            <b>{{ .payload.series.title }} ({{ printf "S%02dE%02d" (toInt (index .payload.episodes 0).seasonNumber) (toInt (index .payload.episodes 0).episodeNumber) }})</b>
            <small>{{ (index .payload.episodes 0).title }}</small>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: low
            url: "{{ .payload.applicationUrl }}/series/{{ .payload.series.titleSlug }}"
            url_title: View Series
          whenExpr: payload.eventType == "Download"
        sonarr-manual:
          target: sonarr
          title: Episode Requires Manual Interaction
          message: |-
            <b>{{ .payload.series.title }}</b>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: high
            url: "{{ .payload.applicationUrl }}/activity/queue"
            url_title: View Queue
          whenExpr: payload.eventType == "ManualInteractionRequired"
        # NOTE: seerr-pushover.sh (the app it replaces) only ever handled
        # TEST_NOTIFICATION - its "*" default case was quoted, so it never
        # matched as a wildcard and every real request notification errored
        # out silently. Jellyseerr/Overseerr's webhook agent has a single
        # URL + payload template for all event types (unlike Radarr/Sonarr,
        # which support multiple independent Connect entries), so this has
        # to be one route with the branching done in the template rather
        # than split across routes/paths. Verify field names against a live
        # payload (Settings > Notifications > Webhook > Test) before relying
        # on this.
        seerr:
          target: seerr
          title: >-
            {{ if eq .payload.notification_type "MEDIA_PENDING" }}Request Pending Approval
            {{- else if eq .payload.notification_type "MEDIA_APPROVED" }}Request Approved
            {{- else if eq .payload.notification_type "MEDIA_AUTO_APPROVED" }}Request Approved
            {{- else if eq .payload.notification_type "MEDIA_AVAILABLE" }}Now Available
            {{- else if eq .payload.notification_type "MEDIA_DECLINED" }}Request Declined
            {{- else if eq .payload.notification_type "MEDIA_FAILED" }}Request Failed
            {{- else if eq .payload.notification_type "TEST_NOTIFICATION" }}Test Notification
            {{- end }}
          message: >-
            {{ if eq .payload.notification_type "TEST_NOTIFICATION" }}Howdy this is a test notification
            {{- else }}<b>{{ .payload.subject }}</b><small>{{ .payload.message }}</small>
            {{- end }}
          params:
            format: html
            priority: >-
              {{ if or (eq .payload.notification_type "MEDIA_DECLINED") (eq .payload.notification_type "MEDIA_FAILED") }}high
              {{- else }}low
              {{- end }}
            url: https://requests.jonandlinz.io
            url_title: Open Requests
          whenExpr: payload.notification_type in ["MEDIA_PENDING", "MEDIA_APPROVED", "MEDIA_AUTO_APPROVED", "MEDIA_AVAILABLE", "MEDIA_DECLINED", "MEDIA_FAILED", "TEST_NOTIFICATION"]
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
