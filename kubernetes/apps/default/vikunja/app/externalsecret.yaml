---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vikunja-secret
    template:
      data:
        # App
        VIKUNJA_SERVICE_JWT_SECRET: "{{ .VIKUNJA_JWT_SECRET }}"
        VIKUNJA_DATABASE_HOST: "{{ .POSTGRES_HOST }}"
        VIKUNJA_DATABASE_DATABASE: "{{ .VIKUNJA_POSTGRES_DB }}"
        VIKUNJA_DATABASE_USER: "{{ .VIKUNJA_POSTGRES_USER }}"
        VIKUNJA_DATABASE_PASSWORD: "{{ .VIKUNJA_POSTGRES_PASS }}"
        # OIDC
        config.yml: |
          auth:
            local:
              enabled: false
            openid:
              enabled: true
              redirecturl: https://todo.jonandlinz.io/auth/openid
              providers:
                - name: Authentik
                  authurl: https://auth.jonandlinz.io/application/o/vikunja/
                  logouturl: https://auth.jonandlinz.io/application/o/vikunja/end-session/
                  clientid: {{ .VIKUNJA_OIDC_CLIENT_ID }}
                  clientsecret: {{ .VIKUNJA_OIDC_CLIENT_SECRET }}
                  scope: openid profile email
  dataFrom:
    - extract:
        key: cloudnativepg
    - extract:
        key: vikunja