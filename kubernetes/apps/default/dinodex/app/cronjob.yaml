---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dinodex-scrape
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      # Stay under the hourly schedule: with concurrencyPolicy Forbid a hung run
      # would otherwise block every later one.
      activeDeadlineSeconds: 3000
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scraper
              # Same image as the app: it already has bash, curl and jq baked in.
              image: ghcr.io/jsimcina/dinodex-to-discord:e85247e@sha256:b1f18a0d73dd64077c1b49b0ca0be0b661783a0de69c3cf45b7990a3cf317717
              command:
                - /bin/sh
                - dinodexscrape.sh
              workingDir: /mnt/data
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: nas-data
                  mountPath: /mnt/data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
            - name: nas-data
              nfs:
                server: nas.jonandlinz.com
                path: /mnt/rustpool/k8s_appdata/dinodata
