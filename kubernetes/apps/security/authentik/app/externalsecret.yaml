---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name authentik-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        # Authentik
        AUTHENTIK_BOOTSTRAP_EMAIL: "{{ .AUTHENTIK_EMAIL }}"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .AUTHENTIK_PASSWORD }}"
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .AUTHENTIK_TOKEN }}"
        AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY }}"
        # Database
        AUTHENTIK_POSTGRESQL__NAME: "{{ .AUTHENTIK_POSTGRESQL__NAME }}"
        AUTHENTIK_POSTGRESQL__HOST: "{{ .AUTHENTIK_POSTGRESQL__HOST }}" # postgres-rw directly, not the pgbouncer pooler
        AUTHENTIK_POSTGRESQL__USER: "{{ .AUTHENTIK_POSTGRESQL__USER }}"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .AUTHENTIK_POSTGRESQL__PASSWORD }}"
        # Email
        AUTHENTIK_EMAIL__HOST: "{{ .AUTHENTIK_EMAIL__HOST }}"
        AUTHENTIK_EMAIL__PORT: "{{ .AUTHENTIK_EMAIL__PORT }}"
        AUTHENTIK_EMAIL__USER: "{{ .AUTHENTIK_EMAIL__USER }}"
        AUTHENTIK_EMAIL__PASSWORD: "{{ .AUTHENTIK_EMAIL__PASSWORD }}"
        AUTHENTIK_EMAIL__USE_SSL: "true"
        AUTHENTIK_EMAIL__DEFAULT_FROM: "{{ .AUTHENTIK_EMAIL__DEFAULT_FROM }}"
  dataFrom:
    - extract:
        key: authentik