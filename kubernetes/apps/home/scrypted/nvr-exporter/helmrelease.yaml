---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrypted-nvr-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: scrypted-nvr-exporter
  interval: 1h
  values:
    controllers:
      scrypted-nvr-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        labels:
          nfsMount: "true"
        containers:
          app:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            command: ["/bin/sh", "/config/exporter.sh"]
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics.txt
                    port: &port 9100
                  initialDelaySeconds: 30
              readiness: *probes
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups:
          - 65542
    service:
      app:
        ports:
          metrics:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            path: /metrics.txt
            interval: 1m
    persistence:
      config:
        type: configMap
        name: scrypted-nvr-exporter
        globalMounts:
          - path: /config
            readOnly: true
      recs:
        type: nfs
        server: nas.jonandlinz.com
        path: /mnt/rustpool/NVR
        globalMounts:
          - path: /NVR
            readOnly: true
      www:
        type: emptyDir
        globalMounts:
          - path: /www
