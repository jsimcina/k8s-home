---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zwave-js-ui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: zwave-js-ui-secret
    template:
      engineVersion: v2
      data:
        KEY_S0_Legacy: "{{ .ZWAVEJS_KEY_S0_Legacy }}"
        KEY_S2_Unauthenticated: "{{ .ZWAVEJS_KEY_S2_Unauthenticated }}"
        KEY_S2_Authenticated: "{{ .ZWAVEJS_KEY_S2_Authenticated }}"
        KEY_S2_AccessControl: "{{ .ZWAVEJS_KEY_S2_AccessControl }}"
  dataFrom:
    - extract:
        key: zwave-secret
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: zwave-js-ui-session
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  noUpper: false
  secretKeys:
    - SESSION_SECRET
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zwave-js-ui-session
spec:
  refreshPolicy: CreatedOnce
  target:
    name: zwave-js-ui-session-secret
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: zwave-js-ui-session
