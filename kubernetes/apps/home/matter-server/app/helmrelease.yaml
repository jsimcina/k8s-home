---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-server
spec:
  chartRef:
    kind: OCIRepository
    name: matter-server
  interval: 1h
  values:
    controllers:
      matter-server:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.5.5@sha256:ee149c7c67eff0e90f131e8f0d628f7b099591ec58473c8cda1209e8ae4df66e
            env:
              TZ: America/Chicago
              # Image default is /data; set explicitly since the volume is mounted there
              STORAGE_PATH: /data
              # The websocket has no auth; keep it off the IoT VLAN. HA and the route reach it
              # through the service
              LISTEN_ADDRESS: eth0
            args:
              # Matter mDNS and link-local traffic go out the IoT interface, where the
              # devices and Thread border routers are
              - --primary-interface
              - net1
              # Behind envoy the URL has no :5580, so the dashboard would prompt for a
              # server address instead of using its own origin's /ws
              - --production-mode
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 5580
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 5580
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 20m
              limits:
                memory: 512Mi
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name":"multus-iot-thread",
            "namespace": "kube-system",
            "ips": ["10.21.5.10/16"],
            "mac": "02:4d:54:15:05:0c"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: 5580
    route:
      app:
        annotations:
          # The route is behind OIDC, so a probe would only see the login redirect;
          # gatus checks /health on the service directly instead
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.jonandlinz.io"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
