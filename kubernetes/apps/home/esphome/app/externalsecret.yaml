---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: esphome
  namespace: home
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: esphome-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secrets.yaml: |-
          wifi_ssid: "{{ .WIFI_SSID }}"
          wifi_password: "{{ .WIFI_PASSWORD }}"
          emporia_encryption_key: "{{ .EMPORIA_VUE_APIKEY }}"
          mqtt_user: "{{ .X_ESPHOME_MQTT_USERNAME }}"
          mqtt_password: "{{ .X_ESPHOME_MQTT_PASSWORD }}"
          wyze_outlets_api_key: "{{ .WYZE_OUTLET_APIKEY }}"
          # Per-device keys, moved out of the device configs
          apollo_plt_1_b2cfa4_api_key: "{{ .ESPHOME_APOLLO_PLT_1_B2CFA4_API_KEY }}"
          bluetooth_proxy_kitchen_ap_password: "{{ .ESPHOME_BLUETOOTH_PROXY_KITCHEN_AP_PASSWORD }}"
          bluetooth_proxy_kitchen_api_key: "{{ .ESPHOME_BLUETOOTH_PROXY_KITCHEN_API_KEY }}"
          bluetooth_proxy_kitchen_ota_password: "{{ .ESPHOME_BLUETOOTH_PROXY_KITCHEN_OTA_PASSWORD }}"
          bt_proxy_office_ap_password: "{{ .ESPHOME_BT_PROXY_OFFICE_AP_PASSWORD }}"
          bt_proxy_office_api_key: "{{ .ESPHOME_BT_PROXY_OFFICE_API_KEY }}"
          bt_proxy_office_ota_password: "{{ .ESPHOME_BT_PROXY_OFFICE_OTA_PASSWORD }}"
          corpse_actuator_api_key: "{{ .ESPHOME_CORPSE_ACTUATOR_API_KEY }}"
          corpse_actuator_ota_password: "{{ .ESPHOME_CORPSE_ACTUATOR_OTA_PASSWORD }}"
          irk_grabber_api_key: "{{ .ESPHOME_IRK_GRABBER_API_KEY }}"
          irk_grabber_ota_password: "{{ .ESPHOME_IRK_GRABBER_OTA_PASSWORD }}"
          konnected_06d604_api_key: "{{ .ESPHOME_KONNECTED_06D604_API_KEY }}"
          misterfancontroller1_ap_password: "{{ .ESPHOME_MISTERFANCONTROLLER1_AP_PASSWORD }}"
          misterfancontroller1_api_key: "{{ .ESPHOME_MISTERFANCONTROLLER1_API_KEY }}"
          misterfancontroller1_ota_password: "{{ .ESPHOME_MISTERFANCONTROLLER1_OTA_PASSWORD }}"
          newt_controller_2_ap_password: "{{ .ESPHOME_NEWT_CONTROLLER_2_AP_PASSWORD }}"
          newt_controller_2_api_key: "{{ .ESPHOME_NEWT_CONTROLLER_2_API_KEY }}"
          newt_controller_2_ota_password: "{{ .ESPHOME_NEWT_CONTROLLER_2_OTA_PASSWORD }}"
          newt_monitor_2_ap_password: "{{ .ESPHOME_NEWT_MONITOR_2_AP_PASSWORD }}"
          newt_monitor_2_api_key: "{{ .ESPHOME_NEWT_MONITOR_2_API_KEY }}"
          newt_monitor_2_ota_password: "{{ .ESPHOME_NEWT_MONITOR_2_OTA_PASSWORD }}"
          newt_monitor_ap_password: "{{ .ESPHOME_NEWT_MONITOR_AP_PASSWORD }}"
          newt_monitor_api_key: "{{ .ESPHOME_NEWT_MONITOR_API_KEY }}"
          newt_monitor_ota_password: "{{ .ESPHOME_NEWT_MONITOR_OTA_PASSWORD }}"
  dataFrom:
    - extract:
        key: esphome-secrets
    - extract:
        key: mqtt-secret
