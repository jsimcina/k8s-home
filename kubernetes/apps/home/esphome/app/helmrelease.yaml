---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esphome
spec:
  chartRef:
    kind: OCIRepository
    name: esphome
  interval: 1h
  values:
    controllers:
      esphome:
        annotations:
          secret.reloader.stakater.com/reload: "{{ .Release.Name }}-secrets"
          configmap.reloader.stakater.com/reload: "{{ .Release.Name }}-configs"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-iot",
                "namespace": "kube-system",
                "ips": ["10.21.5.11/16"],
                "mac": "00:02:b3:df:ed:1b"
              }]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
        containers:
          app:
            image: &image
              repository: ghcr.io/esphome/esphome
              tag: 2026.10.1
            env:
              TZ: America/Chicago
              PLATFORMIO_CORE_DIR: /config/platformio
              PLATFORMIO_GLOBALLIB_DIR: /config/platformio/lib
              # uv defaults to $HOME/.cache/uv, which is unwritable for uid 1000 (the ESP-IDF python env install fails)
              UV_CACHE_DIR: /config/.esphome/uv-cache
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 5m
                memory: 512M
              limits:
                memory: 4096M
        initContainers:
          copy-configs:
            image: *image
            command: ["/bin/sh", "-c"]
            args:
              # The repo is the source of truth: overwrite the device configs on the volume
              - for f in /repo-configs/* /repo-configs/.[!.]*; do [ -f "$f" ] && cp -L "$f" /config/; done

    service:
      app:
        ports:
          http:
            port: 6052

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.jonandlinz.io"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          esphome:
            app:
              - path: /config
            copy-configs:
              - path: /config
      secrets:
        type: secret
        name: "{{ .Release.Name }}-secrets"
        globalMounts:
          - path: /config/secrets.yaml
            subPath: secrets.yaml
      esphome-cache:
        type: emptyDir
        globalMounts:
          - path: /config/.esphome
      esphome-configs:
        type: configMap
        name: "{{ .Release.Name }}-configs"
        advancedMounts:
          esphome:
            copy-configs:
              - path: /repo-configs
                readOnly: true
