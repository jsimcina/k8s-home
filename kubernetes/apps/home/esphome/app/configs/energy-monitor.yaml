esphome:
  name: ${name}
  area: ${area}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

substitutions:
  name: emporiavue3
  friendly_name: Emporia Vue V3
  area: "Basement"

  # Circuit Labels used for publishing to Home Assistant
  circuit_1: "Dishwasher"
  circuit_2: "A/C"
  circuit_3: "Dryer"
  circuit_4: "Upstairs Office, Hallway, and Ryann's Room"
  circuit_5: "Refrigerator"
  circuit_6: "Jon's Office and Living Room"
  circuit_7: "Master Bed, Charlie's Room, and Kids Bathroom"
  circuit_8: "Basement Playroom/Kitchen TV"
  circuit_9: "Furnace Room"
  circuit_10: "Server Rack 1"
  circuit_11: "Laundry Room Outlets"
  circuit_12: "Family Room"
  circuit_13: "Kitchen Instant-Hot"
  circuit_14: "Server Rack 2"
  circuit_15: "Sump Pump"
  circuit_16: "Kitchen Lights, Garage, Dining, and Outdoor Outlets"

  # Icons for Home Assistant
  icon_circuit: "mdi:power-plug"
  icon_current: "mdi:current-ac"
  icon_meter: "mdi:meter-electric"
  icon_phase: "mdi:angle-acute"
  icon_power: "mdi:transmission-tower-import"
  icon_voltage: "mdi:transmission-tower"

# Use Ethernet or WiFi on the Emporia Vue V3 (you can only include one)
# Import the emporia-vue-local v3 community component.
external_components:
  - source: github://emporia-vue-local/esphome@dev
    components:
      - emporia_vue

# The Emporia Vue V3 uses an ESP32 board.
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

api:
  encryption:
    key: !secret emporia_encryption_key

  actions:
    - action: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda "return song_str;"

ota:
  platform: esphome
  on_error:
    then:
      - button.press: safe_mode_button

# Enable logging
logger:
  logs:
    # by default, every reading will be printed to the UART, which is very slow
    # This will disable printing the readings but keep other helpful messages
    sensor: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

preferences:
  # please also make sure `restore: false` is set on all `platform: total_daily_energy`
  # sensors below.
  flash_write_interval: "48h"

output:
  - platform: ledc
    pin: GPIO12
    id: buzzer
  - platform: gpio
    pin: GPIO27
    id: buzzer_gnd

rtttl:
  output: buzzer
  on_finished_playback:
    - logger.log: "Song ended!"

button:
  - platform: template
    name: "Two Beeps"
    on_press:
      - rtttl.play: "two short:d=4,o=5,b=100:16e6,16e6"

  - platform: restart
    name: Restart
    id: restart_button
    icon: mdi:restart

  - platform: safe_mode
    name: Restart (Safe Mode)
    id: safe_mode_button
    icon: mdi:restart-alert

light:
  - platform: status_led
    name: "D3_LED"
    pin: 2
    restore_mode: ALWAYS_ON
    entity_category: config

# Sets up the I²C bus used to communicate with the Emporia Vue hardware.
i2c:
  sda:
    number: 5
    ignore_strapping_warning: true # GPIO5 is a strapping pin; same as the upstream vue3 example
  scl: 18
  scan: false
  frequency: 400kHz # matches the upstream vue3 example
  timeout: 1ms
  id: i2c_a

# Example configuration entry
time:
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago
    servers:
      - 10.0.20.3

# these are called references in YAML. They allow you to reuse
# this configuration in each sensor, while only defining it once
.defaultfilters:
  - &throttle_avg # average all raw readings together over a 5 second span before publishing
    throttle_average: 5s
  - &throttle_avg_30 # average over 30 seconds, publish once per window (power sensors sent to HA)
    throttle_average: 30s
  - &throttle_avg_60 # average over 60 seconds, publish once per window (voltage, frequency, phase angle)
    throttle_average: 60s
  - &throttle_time # only send the most recent measurement every 60 seconds
    throttle: 60s
  - &invert # invert and filter out any values below 0.
    lambda: "return max(-x, 0.0f);"
  - &pos # filter out any values below 0.
    lambda: "return max(x, 0.0f);"
  - &abs # take the absolute value of the value
    lambda: "return abs(x);"

sensor:
  - platform: emporia_vue
    # Without this the component defaults to vue2: wrong CT port map (input "A" read
    # the unused port C) and wrong frequency constant.
    variant: vue3
    i2c_id: i2c_a
    phases:
      - id: phase_a # Verify that this specific phase/leg is connected to correct input wire color on device listed below
        input: BLACK # Vue device wire color
        calibration: 0.0194 # 0.01925 is the upstream vue3 starting point; re-check voltage after the variant change
        # To calculate new calibration value use the formula <in-use calibration value> * <accurate voltage> / <reporting voltage>
        voltage:
          name: "Phase A Voltage"
          filters: [*throttle_avg_60, *pos]
        frequency:
          name: "Phase A Frequency"
          filters: [*throttle_avg_60, *pos]
      - id: phase_b # Verify that this specific phase/leg is connected to correct input wire color on device listed below
        input: RED # Vue device wire color
        calibration: 0.0194 # 0.01925 is the upstream vue3 starting point; re-check voltage after the variant change
        # To calculate new calibration value use the formula <in-use calibration value> * <accurate voltage> / <reporting voltage>
        voltage:
          name: "Phase B Voltage"
          filters: [*throttle_avg_60, *pos]
        phase_angle:
          name: "Phase B Phase Angle"
          filters: [*throttle_avg_60, *pos]
    ct_clamps:
      # Do not specify a name for any of the power sensors here, only an id. This leaves the power sensors internal to ESPHome.
      # Copy sensors will filter and then send power measurements to HA
      # These non-throttled power sensors are used for accurately calculating energy
      - phase_id: phase_a
        input: "A" # Verify the CT going to this device input also matches the phase/leg
        power:
          id: phase_a_power
          # Phase B needs *invert. If phase A still reads ~0 W under load after the
          # variant fix, its clamp faces the other way: change this to *pos.
          filters: [*throttle_avg, *invert]
      - phase_id: phase_b
        input: "B" # Verify the CT going to this device input also matches the phase/leg
        power:
          id: phase_b_power
          filters: [*throttle_avg, *invert]
      # Pay close attention to set the phase_id for each breaker by matching it to the phase/leg it connects to in the panel
      - { phase_id: phase_b, input: "1", power: { id: cir1, filters: [*pos] } }
      - { phase_id: phase_b, input: "2", power: { id: cir2, filters: [*pos, multiply: 2] } }
      - { phase_id: phase_b, input: "3", power: { id: cir3, filters: [*pos, multiply: 2] } }
      - { phase_id: phase_b, input: "4", power: { id: cir4, filters: [*pos] } }
      - { phase_id: phase_b, input: "5", power: { id: cir5, filters: [*pos] } }
      - { phase_id: phase_b, input: "6", power: { id: cir6, filters: [*pos] } }
      - { phase_id: phase_a, input: "7", power: { id: cir7, filters: [*pos] } }
      - { phase_id: phase_a, input: "8", power: { id: cir8, filters: [*pos] } }
      - { phase_id: phase_a, input: "9", power: { id: cir9, filters: [*pos] } }
      - { phase_id: phase_a, input: "10", power: { id: cir10, filters: [*pos] } }
      - { phase_id: phase_b, input: "11", power: { id: cir11, filters: [*pos] } }
      - { phase_id: phase_a, input: "12", power: { id: cir12, filters: [*pos] } }
      - { phase_id: phase_a, input: "13", power: { id: cir13, filters: [*pos] } }
      - { phase_id: phase_b, input: "14", power: { id: cir14, filters: [*pos] } }
      - { phase_id: phase_b, input: "15", power: { id: cir15, filters: [*pos] } }
      - { phase_id: phase_a, input: "16", power: { id: cir16, filters: [*pos] } }
    on_update:
      then:
        - component.update: total_power
        - component.update: balance_power
  # The copy sensors filter and send the power state to HA
  # (a single 30 s averaging window; the old throttle-then-average order published one raw sample)
  - {
      platform: copy,
      name: "Phase A Power",
      source_id: phase_a_power,
      filters: [*throttle_avg_30],
      icon: $icon_power,
    }
  - {
      platform: copy,
      name: "Phase B Power",
      source_id: phase_b_power,
      filters: [*throttle_avg_30],
      icon: $icon_power,
    }
  - {
      platform: copy,
      name: "Total Power",
      source_id: total_power,
      filters: [*throttle_avg_30],
      icon: $icon_power,
    }
  - {
      platform: copy,
      name: "Balance Power",
      source_id: balance_power,
      filters: [*throttle_avg_30],
      icon: $icon_power,
    }
  - {
      platform: copy,
      name: "${circuit_1} Power",
      source_id: cir1,
      filters: [*throttle_avg_30],
      icon: $icon_circuit,
    }
  - {
      platform: copy,
