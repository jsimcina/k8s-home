esphome:
  name: "bt-proxy-office"
  friendly_name: Bluetooth Proxy

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret bt_proxy_office_api_key

ota:
  platform: esphome
  password: !secret bt_proxy_office_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Bluetooth-Proxy Fallback Hotspot"
    password: !secret bt_proxy_office_ap_password

esp32_ble_tracker:
  scan_parameters:
    active: True
    interval: 320ms
    window: 300ms

bluetooth_proxy:
  active: true
