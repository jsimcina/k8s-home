esphome:
  name: newt-monitor-2
  friendly_name: Newt Monitor 2

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret newt_monitor_2_api_key

ota:
  - platform: esphome
    password: !secret newt_monitor_2_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Newt-Monitor 2 Fallback Hotspot"
    password: !secret newt_monitor_2_ap_password

captive_portal:

