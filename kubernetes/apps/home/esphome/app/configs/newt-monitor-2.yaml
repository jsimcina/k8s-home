one_wire:
  - platform: gpio
    pin: GPIO4
    id: x1
  - platform: gpio
    pin: GPIO18
    id: x2

sensor:
  - platform: dallas_temp
    one_wire_id: x1
    name: "In-Tank Submerged Temp"
    accuracy_decimals: 4
    update_interval: 30s
    resolution: 12
    filters:
      - offset: 0.125000

  - platform: dallas_temp
    one_wire_id: x2
    name: "Room Temp"
    accuracy_decimals: 4
    update_interval: 30s
    resolution: 12
    filters:
      - offset: 0.187500

