esphome:
  name: misterfancontroller1
  friendly_name: misterfancontroller1
  on_boot:
    then:
      - fan.turn_on:
          id: mister_fan
          speed: 50
      - delay: 10s
      - button.press: fanpresetbutton

globals:
  - id: fan_interval
    type: int
    restore_value: no
    initial_value: "60000"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret misterfancontroller1_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret misterfancontroller1_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Misterfancontroller1"
    password: !secret misterfancontroller1_ap_password

captive_portal:

output:
  - platform: ledc
    pin: GPIO33
    id: fan_speed
    frequency: 25000hz

sensor:
  - platform: pulse_counter
    name: Fan RPM
    unit_of_measurement: RPM
    pin: GPIO25
    filters:
      - multiply: 0.5
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
    update_interval: 3s

fan:
  - platform: speed
    id: mister_fan
    name: Mister Fan
    speed_count: 100
    restore_mode: RESTORE_DEFAULT_ON
    output: fan_speed

button:
  - platform: template
    name: Fan Preset Start
    id: fanpresetbutton
    on_press:
      - while:
          condition:
            fan.is_on: mister_fan
          then:
            - delay: !lambda return id(fan_interval);
            - if:
                condition:
                  lambda: "return id(mister_fan).speed == 75;"
                then:
                  - fan.turn_on:
                      id: mister_fan
                      speed: 50
                  - lambda: "id(fan_interval) = 60000;"
                else:
                  - fan.turn_on:
                      id: mister_fan
                      speed: 75
                  - lambda: "id(fan_interval) = 15000;"
            - logger.log:
                format: "script.END STARTING AGAIN | mister_fan = %d"
                args: ["id(mister_fan).speed"]
