esphome:
  name: corpse-actuator
  friendly_name: Corpse Actuator
  on_boot:
    then:
      - lambda: |-
          id(actuator_enabled) = true; 
      - switch.turn_on: motor_forward
      - delay: 30s
      - button.press: actuator_button
esp32:
  board: esp32dev
  framework:
    type: arduino

globals:
  - id: actuator_interval
    type: int
    restore_value: no
    initial_value: "0"
  - id: runcount
    type: int
    restore_value: no
    initial_value: "1"
  - id: actuator_enabled
    type: bool
    restore_value: no
  - id: last_motor_direction
    type: std::string
    restore_value: no

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret corpse_actuator_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome
    password: !secret corpse_actuator_ota_password

captive_portal:

switch:
  - platform: gpio
    name: "Open Actuator"
    id: motor_forward
    pin: GPIO4
    interlock: &interlock_group [motor_forward, motor_reverse]

  - platform: gpio
    name: "Close Actuator"
    id: motor_reverse
    pin: GPIO12
    interlock: *interlock_group

  - platform: template
    name: "Enable Actuator"
    id: enable_actuator
    lambda: |-
      if(id(actuator_enabled)) {
        return true;
      }else{
        return false;
      }
    turn_on_action:
      then:
        - lambda: |-
            id(actuator_enabled) = true;
    turn_off_action:
      then:
        - lambda: |-
            id(actuator_enabled) = false;
        - switch.turn_on: motor_reverse
        - delay: 30s
        - switch.turn_off: motor_reverse
        - switch.turn_off: motor_forward

button:
  - platform: template
    name: "Cycle Actuator"
    id: actuator_button
    on_press:
      - while:
          condition:
            switch.is_on: enable_actuator
          then:
            - delay: !lambda return id(actuator_interval);
            - lambda: |-
                if(id(runcount) % 2 != 0) {
                  id(actuator_interval) = 17000; 
                  if(id(motor_forward).state) {
                    id(last_motor_direction) = "motor_reverse";             
                    id(motor_reverse).turn_on();
                  } else if(id(motor_reverse).state ) {                
                    id(last_motor_direction) = "motor_forward";               
                    id(motor_forward).turn_on();
                  }else{
                    if(id(last_motor_direction) == "motor_reverse") {
                      id(last_motor_direction) = "motor_forward";                
                      id(motor_forward).turn_on();
                    }else if(id(last_motor_direction) == "motor_forward") {
                      id(last_motor_direction) = "motor_reverse";
                      id(motor_reverse).turn_on();
                    }else{                  
                      id(last_motor_direction) = "motor_forward";
                      id(motor_forward).turn_on();
                    }
                  }
                }else{
                  id(actuator_interval) = (rand() % 10000 + 1) + 5000;
                  id(motor_forward).turn_off();
                  id(motor_reverse).turn_off();
                }                                      
                id(runcount) = (id(runcount) + 1);
            - logger.log:
                format: "script.END STARTING AGAIN | actuator_interval = %d"
                args: ["id(actuator_interval)"]
