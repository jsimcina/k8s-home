esphome:
  name: bluetooth-proxy-kitchen
  friendly_name: Bluetooth Proxy Kitchen

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret bluetooth_proxy_kitchen_api_key

ota:
  platform: esphome
  password: !secret bluetooth_proxy_kitchen_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Bluetooth-Proxy-Kitchen"
    password: !secret bluetooth_proxy_kitchen_ap_password

esp32_ble_tracker:
  scan_parameters:
    active: True
    interval: 320ms
    window: 300ms

bluetooth_proxy:
  active: true
