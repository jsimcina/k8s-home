esphome:
  name: newt-monitor
  friendly_name: Newt Monitor

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret newt_monitor_api_key

ota:
  - platform: esphome
    password: !secret newt_monitor_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Newt-Monitor Fallback Hotspot"
    password: !secret newt_monitor_ap_password

captive_portal:

one_wire:
  - platform: gpio
    pin: GPIO4
    id: x1
  - platform: gpio
    pin: GPIO18
    id: x2

sensor:
  - platform: dallas_temp
    one_wire_id: x1
    name: "In-Tank Submerged Temp"
    accuracy_decimals: 4
    update_interval: 30s
    resolution: 12
    filters:
      - offset: 0.187500

  - platform: dallas_temp
    one_wire_id: x2
    name: "Room Temp"
    accuracy_decimals: 4
    update_interval: 30s
    resolution: 12
    filters:
      - offset: 0.250000
