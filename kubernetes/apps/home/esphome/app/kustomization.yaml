---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml

configMapGenerator:
  # Shared files included by several device configs. The copy-configs init
  # container copies them into /config on every start; device configs stay
  # on the volume.
  - name: esphome-configs
    files:
      - ./configs/.base-mqtt.yaml
      - ./configs/.base-wifi.yaml
      - ./configs/.ikea-vindriktning-common.yaml
      - ./configs/.wyzeoutlet-common.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # ESPHome uses ${...} substitutions of its own
    kustomize.toolkit.fluxcd.io/substitute: disabled
